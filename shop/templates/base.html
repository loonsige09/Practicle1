{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechStore{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>
<body>
    <header class="header">
        <a class="logo" href="{% url 'home' %}">TechStore</a>
        <nav class="nav-menu">
            <ul>
                <li><a href="{% url 'home' %}">Главная</a></li>
                <li class="has-sub">
                    <a href="{% url 'about' %}">О нас</a>
                    <ul class="submenu">
                        <li><a href="{% url 'contacts' %}">Контакты</a></li>
                        <li><a href="{% url 'location' %}">Как добраться</a></li>
                    </ul>
                </li>
                <li><a href="{% url 'catalog' %}">Витрина</a></li>
                <li><a href="{% url 'promotions' %}">Наши поставщики и страны поставок</a></li>
            </ul>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>&copy; 2026 TechStore. Инновации для вашего дома.</p>
    </footer>
</body>
</html>
