{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechStore{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>
<body>
    <nav class="sidebar">
        <h2>TechStore</h2>
        <ul>
            <li><a href="{% url 'home' %}">Главная</a></li>
            <li class="has-sub">
                <a href="{% url 'about' %}">О компании</a>
                <ul class="submenu">
                    <li><a href="{% url 'contacts' %}">Контакты</a></li>
                    <li><a href="{% url 'location' %}">Как нас найти</a></li>
                </ul>
            </li>
            <li><a href="{% url 'catalog' %}">Каталог товаров</a></li>
            <li><a href="{% url 'promotions' %}">Наши поставщики</a></li>
        </ul>
    </nav>
    <main class="content">
        <div class="box">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
